<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moment Industry - RFQ CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#eef1f4;margin:0;color:#1c1c1c}
  header{background:#1c1c1c;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  header h1{font-size:17px;margin:0}
  header .status{font-size:12px;color:#f5a623}
  nav{display:flex;gap:6px;padding:10px 20px;background:#fff;flex-wrap:wrap;border-bottom:1px solid #dde1e5}
  nav button{background:#eef1f4;border:none;padding:8px 14px;border-radius:5px;cursor:pointer;font-size:13px}
  nav button.active{background:#f5a623;color:#fff;font-weight:600}
  main{padding:18px 20px;max-width:1400px;margin:0 auto}
  .card{background:#fff;border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
  h2{margin:0 0 12px;font-size:17px}
  h3{margin:16px 0 8px;font-size:14px;color:#555}
  label{display:block;font-size:11px;font-weight:700;color:#666;margin:8px 0 3px;text-transform:uppercase;letter-spacing:.3px}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid #ccd2d8;border-radius:5px;font-size:14px;font-family:inherit;background:#fff}
  textarea{min-height:60px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#f5a623}
  button.primary{background:#f5a623;color:#fff;border:none;padding:10px 18px;border-radius:5px;cursor:pointer;font-size:14px;font-weight:600}
  button.dark{background:#333;color:#fff;border:none;padding:10px 18px;border-radius:5px;cursor:pointer;font-size:14px}
  button.ghost{background:#eef1f4;color:#333;border:1px solid #ccd2d8;padding:9px 16px;border-radius:5px;cursor:pointer;font-size:13px}
  button.sm{padding:5px 10px;font-size:12px;border-radius:4px;border:1px solid #ccd2d8;cursor:pointer;background:#fff}
  button.danger{background:#c0392b;color:#fff;border:none;padding:5px 10px;font-size:12px;border-radius:4px;cursor:pointer}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid #eef1f4;vertical-align:top}
  th{background:#f7f9fa;font-weight:700;font-size:11px;text-transform:uppercase;color:#666;letter-spacing:.3px}
  tr:hover td{background:#fcfdfe}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
  @media(max-width:850px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .warn{background:#fff8e1;border:1px solid #ffe08a;color:#7a5b00;padding:10px;border-radius:6px;font-size:13px;margin:8px 0}
  .err{background:#fdecea;border:1px solid #f5b5b0;color:#8a1f1f;padding:10px;border-radius:6px;font-size:13px;margin:8px 0}
  .ok{background:#e8f6ec;border:1px solid #a9dfb8;color:#1c6b33;padding:10px;border-radius:6px;font-size:13px;margin:8px 0}
  .loader{text-align:center;padding:36px;color:#8a9199}
  .acbox{position:relative}
  .aclist{position:absolute;z-index:40;background:#fff;border:1px solid #ccd2d8;width:100%;max-height:230px;overflow-y:auto;border-radius:0 0 6px 6px;box-shadow:0 6px 14px rgba(0,0,0,.12)}
  .acitem{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #f2f4f6}
  .acitem:hover{background:#f7f9fa}
  .clickrow{cursor:pointer}
  .clickrow:hover td{background:#fff8e8}
  .link{color:#1a73e8;cursor:pointer;text-decoration:none}
  .link:hover{text-decoration:underline}
  .pill{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11px;font-weight:700}
  .p-fresh{background:#e8f6ec;color:#1c6b33}
  .p-mid{background:#fff8e1;color:#7a5b00}
  .p-old{background:#fdecea;color:#8a1f1f}
  .p-none{background:#eef1f4;color:#666}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .tile{background:#fff;border-radius:8px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;border-left:4px solid #f5a623}
  .tile:hover{box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .tile h3{margin:0 0 6px;font-size:16px;color:#1c1c1c;text-transform:none;letter-spacing:0}
  .tile p{margin:0;font-size:13px;color:#7a8189}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .kpi .box{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:4px solid #f5a623}
  .kpi .num{font-size:21px;font-weight:800}
  .kpi .lab{font-size:10px;color:#8a9199;text-transform:uppercase;font-weight:700;letter-spacing:.4px;margin-top:3px}
  .itemgrid{width:100%;border-collapse:collapse;font-size:13px}
  .itemgrid th{background:#f7f9fa;padding:7px 6px;font-size:10px}
  .itemgrid td{padding:5px 6px;border-bottom:1px solid #eef1f4}
  .itemgrid input,.itemgrid textarea{padding:6px 7px;font-size:13px;border:1px solid #dfe4e8}
  .itemgrid textarea{min-height:70px;font-size:12px;line-height:1.45}
  .totrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:2px solid #eef1f4}
  .totrow .b{background:#f7f9fa;padding:9px 14px;border-radius:6px;min-width:118px}
  .totrow .l{font-size:10px;color:#8a9199;text-transform:uppercase;font-weight:700}
  .totrow .v{font-size:16px;font-weight:800;margin-top:2px}
  .pos{color:#1c6b33}.neg{color:#8a1f1f}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:100;overflow-y:auto}
  .modal .inner{background:#fff;border-radius:8px;padding:20px;max-width:760px;width:100%}
  .muted{color:#8a9199;font-size:12px}
  .rev-chip{display:inline-block;padding:5px 12px;border-radius:6px;background:#eef1f4;margin:3px 5px 3px 0;cursor:pointer;font-size:13px;border:1px solid #dfe4e8}
  .rev-chip.cur{background:#f5a623;color:#fff;font-weight:700;border-color:#f5a623}
</style>
</head>

const CURSYM={EUR:'\u20AC',USD:'$',EGP:'EGP ',TRY:'\u20BA'};

/* ============ UTIL ============ */
function fmt(n){
  const v=parseFloat(n);
  if(isNaN(v))return '0.00';
  return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function money(n,cur){
  const s=CURSYM[cur]||'';
  return (cur==='EUR'||cur==='TRY')? fmt(n)+' '+s : s+fmt(n);
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function dmy(d){if(!d)return '';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}

/* ============ API ============ */
async function nc(path,opts={}){
  const r=await fetch(API_BASE+path,{...opts,headers:{'xc-token':API_TOKEN,'Content-Type':'application/json',...(opts.headers||{})}});
  if(!r.ok){const t=await r.text();throw new Error(`API ${r.status}: ${t.slice(0,250)}`)}
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')? r.json():null;
}
const listRec=(tid,p={})=>nc(`/tables/${tid}/records?${new URLSearchParams({limit:1000,...p})}`);
const getRec=(tid,id)=>nc(`/tables/${tid}/records/${id}`);
const createRec=(tid,f)=>nc(`/tables/${tid}/records`,{method:'POST',body:JSON.stringify(f)});
const updateRec=(tid,id,f)=>nc(`/tables/${tid}/records`,{method:'PATCH',body:JSON.stringify([{Id:id,...f}])});
const deleteRec=(tid,id)=>nc(`/tables/${tid}/records`,{method:'DELETE',body:JSON.stringify([{Id:id}])});
const link=(tid,fid,rid,ids)=>nc(`/tables/${tid}/links/${fid}/records/${rid}`,{method:'POST',body:JSON.stringify((Array.isArray(ids)?ids:[ids]).map(i=>({Id:i})))});
const unlink=(tid,fid,rid,ids)=>nc(`/tables/${tid}/links/${fid}/records/${rid}`,{method:'DELETE',body:JSON.stringify((Array.isArray(ids)?ids:[ids]).map(i=>({Id:i})))});

/* ============ SCHEMA ============ */
let SCHEMA={},T={};
async function loadSchema(){
  const r=await nc(`/meta/bases/${BASE_ID}/tables`);
  for(const t of r.list){SCHEMA[t.title]=await nc(`/meta/tables/${t.id}`)}
}
function tbl(...names){
  for(const n of names){
    const k=Object.keys(SCHEMA).find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,'')===n.toLowerCase().replace(/[^a-z0-9]/g,''));
    if(k)return SCHEMA[k];
  }
  throw new Error(`Table not found: ${names[0]}. Available: ${Object.keys(SCHEMA).join(', ')}`);
}
function col(t,...kws){
  for(const kw of kws){
    let c=t.columns.find(c=>c.title.toLowerCase()===kw.toLowerCase());
    if(c)return c;
  }
  for(const kw of kws){
    let c=t.columns.find(c=>c.title.toLowerCase().replace(/[^a-z0-9]/g,'').includes(kw.toLowerCase().replace(/[^a-z0-9]/g,'')));
    if(c)return c;
  }
  return null;
}
function pv(t){return t.columns.find(c=>c.pv)||t.columns[0]}
function cn(t,...kws){const c=col(t,...kws);return c?c.title:null}
function linkedId(rec,title){
  if(!title)return null;
  const v=rec[title];
  if(!v)return null;
  if(Array.isArray(v))return v[0]?.Id??null;
  if(typeof v==='object')return v.Id??null;
  return null;
}
function linkedName(rec,title){
  if(!title)return '';
  const v=rec[title];
  if(!v)return '';
  const one=x=>{const k=Object.keys(x).find(k=>k!=='Id');return k?x[k]:x.Id};
  if(Array.isArray(v))return v.map(one).join(', ');
  if(typeof v==='object')return one(v);
  return String(v);
}
async function childrenOf(childTbl,linkKws,parentId){
  const lc=col(childTbl,...linkKws);
  if(!lc)return [];
  const r=await listRec(childTbl.id,{limit:2000});
  return (r.list||[]).filter(x=>linkedId(x,lc.title)===parentId);
}

let VIEW='home',app,navBar,connStatus;
const NAV=[['home','🏠 Home'],['search','🔍 Search'],['companies','🏢 Companies'],['newRfq','➕ New RFQ'],['suppliers','🚚 Suppliers'],['products','📦 Products'],['dashboard','📊 Dashboard']];

function drawNav(){
  navBar.innerHTML='';
  NAV.forEach(([id,lab])=>{
    const b=document.createElement('button');
    b.textContent=lab;
    if(VIEW===id)b.className='active';
    b.onclick=()=>{VIEW=id;route()};
    navBar.appendChild(b);
  });
}
function route(){
  drawNav();
  ({home:renderHome,search:renderSearch,companies:renderCompanies,newRfq:renderNewRfq,
    suppliers:renderSuppliers,products:renderProducts,dashboard:renderDashboard}[VIEW]||renderHome)();
}

/* ============ PRICE AGE ============ */
function priceAge(d){
  if(!d)return '<span class="pill p-none">no date</span>';
  const days=(Date.now()-new Date(d).getTime())/864e5;
  const label=dmy(d);
  if(days<=180)return `<span class="pill p-fresh">${label}</span>`;
  if(days<=365)return `<span class="pill p-mid">${label}</span>`;
  return `<span class="pill p-old">${label}</span>`;
}

      <div><label>Contact</label><input id="sC"></div>

async function saveSupplier(){
  const m=document.getElementById('sMsg');
  const n=document.getElementById('sN').value.trim();
  if(!n){m.innerHTML='<div class="err">Name required.</div>';return}
  try{
    const f={[pv(T.Sup).title]:n};
    const c=cn(T.Sup,'contact'),p=cn(T.Sup,'phone'),e=cn(T.Sup,'email');
    if(c)f[c]=document.getElementById('sC').value;
    if(p)f[p]=document.getElementById('sP').value;
    if(e)f[e]=document.getElementById('sE').value;
    await createRec(T.Sup.id,f);
    renderSuppliers();
  }catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`}
}

async function editProduct(id){
  const p=await getRec(T.Prod.id,id);

  const sn=pv(T.Sup).title;
  const sku=pv(T.Prod).title,pn=cn(T.Prod,'name'),cost=cn(T.Prod,'cost'),cat=cn(T.Prod,'category'),pd=cn(T.Prod,'price updated','priceupdated'),sp=cn(T.Prod,'specification'),sl=cn(T.Prod,'supplier'),curc=cn(T.Prod,'currency');

  d.innerHTML=`<div class="inner">

      <div><label>Supplier</label><select id="eSup"><option value="">— none —</option>${sups.map(x=>`<option value="${x.Id}" ${x.Id===curSup?'selected':''}>${esc(x[sn])}</option>`).join('')}</select></div>

      <div><label>Currency</label><select id="eCur">${curOptsHtml}</select></div>

      <div><label>Category</label><input id="eCat" value="${esc(p[cat]||'')}"></div>

      <button class="primary" onclick="saveProductEdit(${id})">Save Changes</button>
      <button class="ghost" onclick="document.getElementById('pModal').remove()">Cancel</button>

    </div>
    <div id="eMsg"></div>
  </div>`;

async function saveProductEdit(id){
  const m=document.getElementById('eMsg');
  try{
    const f={};
    const sku=pv(T.Prod).title,pn=cn(T.Prod,'name'),cost=cn(T.Prod,'cost'),cat=cn(T.Prod,'category'),pd=cn(T.Prod,'price updated','priceupdated'),sp=cn(T.Prod,'specification'),curc=cn(T.Prod,'currency');
    f[sku]=document.getElementById('eS').value;
    if(pn&&pn!==sku)f[pn]=document.getElementById('eN').value;
    if(cost)f[cost]=parseFloat(document.getElementById('eC').value)||0;
    if(curc)f[curc]=document.getElementById('eCur').value;
    if(cat)f[cat]=document.getElementById('eCat').value;
    if(pd)f[pd]=document.getElementById('eD').value||null;
    if(sp)f[sp]=document.getElementById('eSpec').value;
    await updateRec(T.Prod.id,id,f);
    const sl=col(T.Prod,'supplier');
    if(sl){
      const cur=await getRec(T.Prod.id,id);
      const old=linkedId(cur,sl.title);
      const nw=parseInt(document.getElementById('eSup').value)||null;
      if(old!==nw){
        if(old)try{await unlink(T.Prod.id,sl.id,id,[old])}catch(e){}
        if(nw)await link(T.Prod.id,sl.id,id,[nw]);
      }
    }
    document.getElementById('pModal').remove();
    route();
  }catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
async function deleteProduct(id){
  if(!confirm('Delete this product permanently?'))return;
  await deleteRec(T.Prod.id,id);
  document.getElementById('pModal').remove();
  route();
}

    const ctl=col(T.RFQ,'contact person','contactperson');
    if(contId&&ctl)await link(T.RFQ.id,ctl.id,rec.Id,[parseInt(contId)]);

/* ============ REVISIONS ============ */
async function newRevision(rfqId,items){
  const existing=await childrenOf(T.Rev,['parent'],rfqId);
  const n=existing.length;
  const f={[pv(T.Rev).title]:'R'+n};
  const d=cn(T.Rev,'revision date','date'),v=cn(T.Rev,'validity');
  if(d)f[d]=today();
  if(v)f[v]=addDays(today(),30);
  const rec=await createRec(T.Rev.id,f);
  const pl=col(T.Rev,'parent');
  if(pl)await link(T.Rev.id,pl.id,rec.Id,[rfqId]);
  if(items&&items.length)await writeItems(rec.Id,items);
  return rec.Id;
}
async function writeItems(revId,items){
  const nameC=pv(T.Item).title,qC=cn(T.Item,'quantity'),pC=cn(T.Item,'unit price'),
        dC=cn(T.Item,'description'),delC=cn(T.Item,'delivery'),lC=cn(T.Item,'line no','lineno'),
        ccC=cn(T.Item,'cost price');
  const rl=col(T.Item,'revision'),pl=col(T.Item,'product');
  for(let i=0;i<items.length;i++){
    const it=items[i],f={};
    f[nameC]=it.name||'';
    if(qC)f[qC]=it.qty||0;
    if(pC)f[pC]=it.price||0;
    if(ccC)f[ccC]=it.cost||0;
    if(dC)f[dC]=it.desc||'';
    if(delC)f[delC]=it.delivery||'';
    if(lC)f[lC]=i+1;
    const rec=await createRec(T.Item.id,f);
    if(rl)await link(T.Item.id,rl.id,rec.Id,[revId]);
    if(pl&&it.productId)await link(T.Item.id,pl.id,rec.Id,[it.productId]);
  }
}

      <div><label>Salesperson</label><input value="${esc(rfq[cn(T.RFQ,'salesperson')]||'')}" onchange="setRfq('salesperson',this.value)"></div>
      <div><label>Currency</label><input value="${esc(currency)}" disabled></div>
      <div><label>Quotation Date</label><input type="date" value="${(cur[cn(T.Rev,'revision date','date')]||'').slice(0,10)}" onchange="setRev('revision date',this.value)"></div>
      <div><label>Expiration</label><input type="date" value="${(cur[cn(T.Rev,'validity')]||'').slice(0,10)}" onchange="setRev('validity',this.value)"></div>
    </div>
    <div class="g2" style="margin-top:8px">
      <div><label>Payment Terms</label><textarea style="min-height:44px" onchange="setRfq('payment terms',this.value)">${esc(rfq[cn(T.RFQ,'payment terms')]||'')}</textarea></div>
      <div><label>Delivery Method</label><textarea style="min-height:44px" onchange="setRfq('delivery method',this.value)">${esc(rfq[cn(T.RFQ,'delivery method')]||'')}</textarea></div>
    </div>
  </div>

  <div class="card">
    <h2>Revisions</h2>
    ${revs.map(r=>`<span class="rev-chip ${r.Id===cur.Id?'cur':''}" onclick="openRfq(${rfqId},${r.Id})">${esc(r[pv(T.Rev).title])}</span>`).join('')}

function drawBrowseList(){

  <td><button class="sm" onclick="this.disabled=true;addFromProduct(${p.Id});document.getElementById('browseModal').remove()">Add</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No products match.</td></tr>'}</table>`;
}
function filterBrowseList(){drawBrowseList()}
async function addFromProduct(pid){
  const existingIdx=CUR.rows.findIndex(r=>r.productId===pid);
  if(existingIdx>=0){
    const ok=confirm(`This product is already on line ${existingIdx+1}. Add it again as a separate line?`);
    if(!ok)return;
  }
  const p=await getRec(T.Prod.id,pid);
  let cost=p[cn(T.Prod,'cost')]||0;
  const prodCurCol=cn(T.Prod,'currency');
  const prodCur=prodCurCol?p[prodCurCol]:null;
  if(prodCur&&CUR.currency&&prodCur!==CUR.currency){
    const rateStr=prompt(`This product is priced in ${prodCur}, but this quotation is in ${CUR.currency}.\nEnter the exchange rate: 1 ${prodCur} = ? ${CUR.currency}`,'');
    const rate=parseFloat(rateStr);
    if(!rate||rate<=0){alert('No valid rate entered - item not added.');return}
    cost=cost*rate;
  }
  const margin=CUR.marginPct||0;
  CUR.rows.push({
    id:null,
    name:p[cn(T.Prod,'name')]||p[pv(T.Prod).title]||'',
    desc:p[cn(T.Prod,'specification')]||'',
    delivery:'',
    qty:1,
    price:cost*(1+margin/100),
    cost:cost,
    productId:pid
  });
  drawGrid();
}
function applyMarginToAll(){
  const margin=CUR.marginPct||0;
  CUR.rows.forEach(r=>{r.price=(r.cost||0)*(1+margin/100)});
  drawGrid();
}
function addBlankRow(){
  CUR.rows.push({id:null,name:'',desc:'',delivery:'',qty:1,price:0,cost:0,productId:null});
  drawGrid();
}
function delRow(i){CUR.rows.splice(i,1);drawGrid()}
function moveRow(i,d){
  const j=i+d;
  if(j<0||j>=CUR.rows.length)return;
  [CUR.rows[i],CUR.rows[j]]=[CUR.rows[j],CUR.rows[i]];
  drawGrid();
}
function setCell(i,k,v){
  CUR.rows[i][k]=(k==='qty'||k==='price')? (parseFloat(v)||0) : v;
  if(k==='qty'||k==='price'){
    const cell=document.getElementById('amt-'+i);
    if(cell)cell.textContent=fmt(CUR.rows[i].qty*CUR.rows[i].price);
    drawTotals();
  }
}
function drawGrid(){
  const g=document.getElementById('grid');
  if(!CUR.rows.length){g.innerHTML='<div class="warn">No items yet. Search the catalogue above or add a blank line.</div>';drawTotals();return}
  g.innerHTML=`<table class="itemgrid">
  <tr><th style="width:26px">#</th><th style="width:22%">Product Name</th><th>Description / Specification</th><th style="width:88px">Delivery</th><th style="width:70px">Qty</th><th style="width:92px">Unit Price</th><th style="width:96px">Amount</th><th style="width:74px"></th></tr>
  ${CUR.rows.map((r,i)=>`<tr>
    <td>${i+1}</td>
    <td><input value="${esc(r.name)}" onchange="setCell(${i},'name',this.value)"></td>
    <td><textarea onchange="setCell(${i},'desc',this.value)">${esc(r.desc)}</textarea></td>
    <td><input value="${esc(r.delivery)}" onchange="setCell(${i},'delivery',this.value)"></td>
    <td><input type="number" step="any" value="${r.qty}" onchange="setCell(${i},'qty',this.value)"></td>
    <td><input type="number" step="0.01" value="${r.price}" onchange="setCell(${i},'price',this.value)"></td>
    <td style="text-align:right;padding-top:12px"><b id="amt-${i}">${fmt(r.qty*r.price)}</b></td>
    <td><button class="sm" onclick="moveRow(${i},-1)">↑</button> <button class="sm" onclick="moveRow(${i},1)">↓</button><br>
        <button class="danger" style="margin-top:4px" onclick="delRow(${i})">✕</button></td>
  </tr>`).join('')}</table>`;
  drawTotals();
}
function drawTotals(){
  let total=0,cost=0;
  CUR.rows.forEach(r=>{total+=r.qty*r.price;cost+=r.qty*(r.cost||0)});
  const profit=total-cost,margin=total?(profit/total*100):0;
  document.getElementById('totals').innerHTML=`<div class="totrow">
    <div class="b"><div class="l">Lines</div><div class="v">${CUR.rows.length}</div></div>
    <div class="b"><div class="l">Cost</div><div class="v">${fmt(cost)}</div></div>
    <div class="b"><div class="l">Profit</div><div class="v ${profit>=0?'pos':'neg'}">${fmt(profit)}</div></div>
    <div class="b"><div class="l">Margin</div><div class="v ${profit>=0?'pos':'neg'}">${margin.toFixed(1)}%</div></div>
    <div class="b" style="background:#1c1c1c;color:#fff"><div class="l" style="color:#bbb">Total (${esc(CUR.currency)})</div><div class="v">${fmt(total)}</div></div>
  </div>`;
}

async function deleteWholeRfq(rfqId){
  if(!confirm('Delete this ENTIRE quotation - all revisions and all items, permanently? This cannot be undone.'))return;
  const revs=await childrenOf(T.Rev,['parent'],rfqId);
  for(const r of revs){
    const items=await childrenOf(T.Item,['revision'],r.Id);
    for(const it of items)await deleteRec(T.Item.id,it.Id);
    await deleteRec(T.Rev.id,r.Id);
  }
  await deleteRec(T.RFQ.id,rfqId);
  VIEW='search';route();
}
async function saveItems(asNew){
  const m=document.getElementById('saveMsg');
  const unpriced=CUR.rows.filter((r,i)=>r.cost>0&&Math.abs(r.price-r.cost)<0.005);
  if(unpriced.length){
    const lines=unpriced.map(r=>CUR.rows.indexOf(r)+1).join(', ');
    const proceed=confirm(`Line(s) ${lines} are priced exactly at cost \u2014 margin may not have been applied. Save anyway?`);
    if(!proceed)return;
  }
  m.innerHTML='<div class="loader">Saving…</div>';
  try{
    if(asNew){
      await newRevision(CUR.rfqId,CUR.rows);
      m.innerHTML='<div class="ok">New revision created.</div>';
      openRfq(CUR.rfqId);
      return;
    }
    const existing=await childrenOf(T.Item,['revision'],CUR.revId);
    for(const e of existing)await deleteRec(T.Item.id,e.Id);
    await writeItems(CUR.revId,CUR.rows);
    m.innerHTML='<div class="ok">Saved.</div>';
    openRfq(CUR.rfqId,CUR.revId);
  }catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`}
}

async function buildAndOpenPdf(newTab){
  const rfq=await getRec(T.RFQ.id,CUR.rfqId);

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  const L=14,R=W-14;

  function header(){
    try{
      doc.addImage(LOGO_DATA,'JPEG',L,8,32,12);
    }catch(e){
      doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(30,30,30);

    doc.text('Tel: '+CO.tel,L,31);
    doc.text('Email: '+CO.email,L,34);
    doc.text('Website: '+CO.web,L,37);
    doc.setDrawColor(180);doc.setLineWidth(.3);doc.line(L,39,R,39);
  }
  function footer(p,tot){
    doc.setFontSize(7.5);doc.setTextColor(120);
    doc.text(`Page: ${p} / ${tot}`,W/2,H-10,{align:'center'});
  }

  header();
  doc.setTextColor(41,98,175);doc.setFont('helvetica','normal');doc.setFontSize(15);
  doc.text('Quotation # '+num,L,49);

  const clientName=comp[pv(T.Comp).title]||'';
  const clientAddr=comp[cn(T.Comp,'address')]||'';
  const clientPhone=comp[cn(T.Comp,'phone')]||'';
  const clientEmail=comp[cn(T.Comp,'email')]||'';
  doc.setTextColor(130);doc.setFontSize(7);doc.setFont('helvetica','normal');
  doc.text('QUOTATION FOR / TO:',R,42,{align:'right'});
  doc.setTextColor(40);doc.setFontSize(9.5);doc.setFont('helvetica','bold');
  let cy=46;
  doc.text(doc.splitTextToSize(clientName,80),R,cy,{align:'right'});
  cy+=(doc.splitTextToSize(clientName,80).length*4)+1;
  doc.setFont('helvetica','normal');doc.setFontSize(7.2);doc.setTextColor(70);
  if(clientAddr){const al=doc.splitTextToSize(clientAddr,80);doc.text(al,R,cy,{align:'right'});cy+=al.length*3.3}
  if(clientPhone){doc.text(clientPhone,R,cy,{align:'right'});cy+=3.3}
  if(clientEmail){doc.text(clientEmail,R,cy,{align:'right'});cy+=3.3}

  const refY=Math.max(62,cy+4);
  doc.setFontSize(8.5);doc.setTextColor(41,98,175);
  doc.text('Your Reference:',L,refY);
  doc.text('Quotation Date:',L+58,refY);
  doc.text('Expiration:',L+108,refY);
  doc.text('Salesperson:',L+148,refY);
  doc.setTextColor(40);
  doc.text(String(rfq[cn(T.RFQ,'project')]||''),L,refY+5);

  doc.text(dmy(rev[cn(T.Rev,'validity')]),L+108,refY+5);
  doc.text(String(rfq[cn(T.RFQ,'salesperson')]||''),L+148,refY+5);

  const body=CUR.rows.map(r=>{
    const desc=(r.name?r.name+'\n':'')+(r.desc||'');
    return [desc,r.delivery||'',fmt(r.qty),fmt(r.price)+' '+sym,fmt(r.qty*r.price)+' '+sym];
  });
  let total=0;CUR.rows.forEach(r=>total+=r.qty*r.price);
  const totalRowIndex=body.length;
  body.push(['','','','Total',fmt(total)+' '+sym]);

  doc.autoTable({
    head:[['Description','Delivery','Quantity','Unit Price','Amount']],
    body,
    startY:Math.max(76,refY+12),
    margin:{left:L,right:14,top:42},
    theme:'grid',
    styles:{fontSize:7.5,cellPadding:2,textColor:30,lineColor:[190,190,190],lineWidth:.2,valign:'top'},
    headStyles:{fillColor:[255,255,255],textColor:[41,98,175],fontStyle:'normal',fontSize:8.5,lineColor:[150,150,150]},
    columnStyles:{0:{cellWidth:88},1:{cellWidth:22,halign:'center'},2:{cellWidth:22,halign:'center'},3:{cellWidth:26,halign:'right'},4:{cellWidth:28,halign:'right'}},
    didParseCell:(data)=>{
      if(data.section==='body'&&data.row.index===totalRowIndex){
        data.cell.styles.fontStyle='bold';
        data.cell.styles.fontSize=9;
        data.cell.styles.lineWidth=.3;
        data.cell.styles.lineColor=[150,150,150];
      }
    },
    didDrawPage:()=>{header()}
  });

  // Terms page
  doc.addPage();header();
  doc.setTextColor(41,98,175);doc.setFont('helvetica','normal');doc.setFontSize(14);
  doc.text('Terms & Conditions',L,48);
  let ty=58;
  const payTerms=rfq[cn(T.RFQ,'payment terms')]||'';
  const delMethod=rfq[cn(T.RFQ,'delivery method')]||'';
  TERMS.forEach(([head,txt])=>{
    let bodyTxt=txt;
    if(head==='Payment Terms:')bodyTxt=payTerms;
    if(head==='Delivery Method:'&&delMethod)bodyTxt=delMethod;
    if(!bodyTxt)return;
    if(ty>H-40){doc.addPage();header();ty=48}
    doc.setTextColor(41,98,175);doc.setFontSize(9);doc.setFont('helvetica','normal');
    doc.text(head,L,ty);ty+=4.5;
    doc.setTextColor(40);doc.setFontSize(7.8);
    const lines=doc.splitTextToSize(bodyTxt,R-L);
    lines.forEach(ln=>{
      if(ty>H-16){doc.addPage();header();ty=48}
      doc.text(ln,L,ty);ty+=3.6;
    });
    ty+=4;
  });

  const tot=doc.internal.getNumberOfPages();
  for(let i=1;i<=tot;i++){doc.setPage(i);footer(i,tot)}
  const blobUrl=doc.output('bloburl');
  if(newTab){newTab.location.href=blobUrl}
  else{window.open(blobUrl,'_blank')}
}

/* ============ DASHBOARD ============ */
async function renderDashboard(){
  app.innerHTML='<div class="loader">Crunching…</div>';
  const [rfqR,itemR,revR]=await Promise.all([listRec(T.RFQ.id),listRec(T.Item.id,{limit:5000}),listRec(T.Rev.id,{limit:5000})]);
  const rfqs=rfqR.list||[],items=itemR.list||[],revs=revR.list||[];
  const qC=cn(T.Item,'quantity'),pC=cn(T.Item,'unit price'),cC=cn(T.Item,'cost price'),rl=cn(T.Item,'revision');
  const parentC=cn(T.Rev,'parent');

  const revToRfq={};revs.forEach(r=>revToRfq[r.Id]=linkedId(r,parentC));
  const latestRev={};
  revs.forEach(r=>{
    const rq=revToRfq[r.Id];if(!rq)return;
    const n=parseInt(String(r[pv(T.Rev).title]||'').replace(/\D/g,''))||0;
    if(!latestRev[rq]||n>latestRev[rq].n)latestRev[rq]={id:r.Id,n};
  });
  const activeRevs=new Set(Object.values(latestRev).map(x=>x.id));

  let total=0,cost=0;
  items.forEach(i=>{
    const rid=linkedId(i,rl);
    if(!activeRevs.has(rid))return;
    total+=(i[qC]||0)*(i[pC]||0);
    cost+=(i[qC]||0)*(i[cC]||0);
  });
  const profit=total-cost,margin=total?(profit/total*100):0;

  const stC=cn(T.RFQ,'status');
  const byStatus={};
  rfqs.forEach(r=>{const s=r[stC]||'—';byStatus[s]=(byStatus[s]||0)+1});

  app.innerHTML=`
  <div class="kpi">
    <div class="box"><div class="num">${rfqs.length}</div><div class="lab">Quotations</div></div>
    <div class="box"><div class="num">${fmt(total)}</div><div class="lab">Quoted value</div></div>
    <div class="box"><div class="num">${fmt(cost)}</div><div class="lab">Cost</div></div>
    <div class="box"><div class="num ${profit>=0?'pos':'neg'}">${fmt(profit)}</div><div class="lab">Profit</div></div>
    <div class="box"><div class="num">${margin.toFixed(1)}%</div><div class="lab">Margin</div></div>
  </div>
  <div class="card">
    <h2>By Status</h2>
    <table><tr><th>Status</th><th>Count</th></tr>
    ${Object.entries(byStatus).map(([s,c])=>`<tr><td>${esc(s)}</td><td>${c}</td></tr>`).join('')}</table>
  </div>
  <div class="warn">Figures cover the latest revision of each quotation, and mix currencies if you quote in more than one. Per-period and per-client breakdowns come next.</div>`;
}
</script>
