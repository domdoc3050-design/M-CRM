/* ================= API HELPERS ================= */
async function ncFetch(path, opts={}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      'xc-token': API_TOKEN,
      'Content-Type': 'application/json',
      ...(opts.headers||{})
    }
  });
  if (!res.ok) {
    let txt = await res.text();
    throw new Error(`API ${res.status}: ${txt.slice(0,300)}`);
  }
  const ct = res.headers.get('content-type')||'';
  if (ct.includes('application/json')) return res.json();
  return null;
}

async function listRecords(tableId, params={}) {
  const p = new URLSearchParams(params);
  return ncFetch(`/tables/${tableId}/records?${p.toString()}`);
}
async function createRecord(tableId, fields) {
  return ncFetch(`/tables/${tableId}/records`, { method:'POST', body: JSON.stringify(fields) });
}
async function updateRecord(tableId, id, fields) {
  return ncFetch(`/tables/${tableId}/records`, { method:'PATCH', body: JSON.stringify([{Id:id, ...fields}]) });
}
async function linkRecords(tableId, fieldId, recordId, relatedIds) {
  const body = (Array.isArray(relatedIds)?relatedIds:[relatedIds]).map(id=>({Id:id}));
  return ncFetch(`/tables/${tableId}/links/${fieldId}/records/${recordId}`, { method:'POST', body: JSON.stringify(body) });
}
async function listLinked(tableId, fieldId, recordId) {
  try {
    return await ncFetch(`/tables/${tableId}/links/${fieldId}/records/${recordId}?limit=1000`);
  } catch(e) { return { list: [] }; }
}

/* ================= SCHEMA DISCOVERY ================= */
let SCHEMA = {}; // title -> {id, title, columns:[...]}

async function loadSchema() {
  const tablesResp = await ncFetch(`/meta/bases/${BASE_ID}/tables`);
  for (const t of tablesResp.list) {
    const full = await ncFetch(`/meta/tables/${t.id}`);
    SCHEMA[t.title] = full;
  }
}

function getTable(name) {
  const key = Object.keys(SCHEMA).find(k => k.toLowerCase().replace(/[^a-z0-9]/g,'') === name.toLowerCase().replace(/[^a-z0-9]/g,''));
  if (!key) throw new Error(`Table not found: ${name}. Found tables: ${Object.keys(SCHEMA).join(', ')}`);
  return SCHEMA[key];
}
function findCol(table, keywords) {
  const kws = Array.isArray(keywords)?keywords:[keywords];
  for (const kw of kws) {
    const c = table.columns.find(c => c.title.toLowerCase().includes(kw.toLowerCase()));
    if (c) return c;
  }
  return null;
}
function primaryCol(table) {
  return table.columns.find(c => c.pv) || table.columns[0];
}

/* ================= APP STATE ================= */
let T = {}; // resolved tables
let VIEW = 'home';

const app = document.getElementById('app');
const navBar = document.getElementById('navBar');
const connStatus = document.getElementById('connStatus');

const NAV_ITEMS = [
  {id:'home', label:'🏠 Home'},
  {id:'search', label:'🔍 Search'},
  {id:'companies', label:'🏢 Companies'},
  {id:'newRfq', label:'➕ New RFQ'},
  {id:'dashboard', label:'📊 Dashboard'},
  {id:'suppliers', label:'🚚 Suppliers'},
  {id:'products', label:'📦 Products'},
];

function renderNav() {
  navBar.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    const b = document.createElement('button');
    b.textContent = item.label;
    if (VIEW === item.id) b.className = 'active';
    b.onclick = () => { VIEW = item.id; route(); };
    navBar.appendChild(b);
  });
}

/* ================= INIT ================= */
(async function init() {
  try {
    await loadSchema();
    T.Suppliers = getTable('Suppliers');
    T.Products = getTable('Products');
    T.Companies = getTable('Companies');
    T.Contacts = getTable('Contacts');
    T.RFQs = (function(){ try { return getTable('RFQs'); } catch(e) { return getTable('RFQ'); } })();
    T.Revisions = getTable('RFQ_Revisions');
    T.Items = getTable('RFQ_Items');
    connStatus.textContent = '✅ Connected';
    renderNav();
    route();
  } catch (e) {
    connStatus.textContent = '❌ Connection failed';
    app.innerHTML = `<div class="card err">
      <strong>Could not connect / load schema.</strong><br><br>
      ${e.message}<br><br>
      Check: API token valid, Base ID correct, table names match (Suppliers, Products, Companies, Contacts, RFQs, RFQ_Revisions, RFQ_Items).
    </div>`;
  }
})();

function route() {

  if (VIEW === 'home') return renderHome();

/* ================= SEARCH ================= */
function renderSearch() {
  app.innerHTML = `
    <div class="card">
      <h2>Search RFQs</h2>
      <input id="rfqSearchBox" placeholder="Type RFQ number or company name...">
      <div id="rfqSearchResults"></div>
    </div>
    <div class="card">
      <h2>Search Products</h2>
      <input id="prodSearchBox" placeholder="Type product name or SKU...">
      <div id="prodSearchResults"></div>
    </div>
  `;
  document.getElementById('rfqSearchBox').addEventListener('input', debounce(doRfqSearch, 400));
  document.getElementById('prodSearchBox').addEventListener('input', debounce(doProdSearch, 400));
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); };
}

async function doRfqSearch() {
  const q = document.getElementById('rfqSearchBox').value.trim();
  const box = document.getElementById('rfqSearchResults');
  if (!q) { box.innerHTML=''; return; }
  box.innerHTML = '<div class="loader">Searching...</div>';
  const dealCol = primaryCol(T.RFQs);
  const rfqNumCol = findCol(T.RFQs, ['rfq number','quotation number']);
  const companyCol = findCol(T.RFQs, ['company']);
  const resp = await listRecords(T.RFQs.id, { limit: 100 });
  const list = resp.list || [];
  const matches = list.filter(r => {
    const deal = (r[dealCol.title]||'').toString().toLowerCase();
    const num = (r[rfqNumCol?.title]||'').toString().toLowerCase();
    const comp = getLinkedDisplay(r, companyCol?.title);
    return deal.includes(q.toLowerCase()) || num.includes(q.toLowerCase()) || comp.toLowerCase().includes(q.toLowerCase());
  });
  if (!matches.length) { box.innerHTML = '<div class="warn">No matches.</div>'; return; }
  box.innerHTML = `<table><tr><th>RFQ Number</th><th>Deal</th><th>Company</th><th>Status</th><th></th></tr>` +
    matches.map(r => `<tr>
      <td>${r[rfqNumCol?.title]||''}</td>
      <td>${r[dealCol.title]||''}</td>
      <td>${getLinkedDisplay(r, companyCol?.title)}</td>
      <td>${r[findCol(T.RFQs,['status'])?.title]||''}</td>
      <td><button class="small" onclick="openRfq(${r.Id})">Open</button></td>
    </tr>`).join('') + `</table>`;
}

async function doProdSearch() {
  const q = document.getElementById('prodSearchBox').value.trim();
  const box = document.getElementById('prodSearchResults');
  if (!q) { box.innerHTML=''; return; }
  box.innerHTML = '<div class="loader">Searching...</div>';
  const nameCol = findCol(T.Products, ['name']) || primaryCol(T.Products);
  const skuCol = findCol(T.Products, ['sku']) || primaryCol(T.Products);
  const costCol = findCol(T.Products, ['cost']);
  const resp = await listRecords(T.Products.id, { limit: 500 });
  const list = resp.list || [];
  const matches = list.filter(r =>
    (r[nameCol.title]||'').toString().toLowerCase().includes(q.toLowerCase()) ||
    (r[skuCol.title]||'').toString().toLowerCase().includes(q.toLowerCase())
  );
  if (!matches.length) { box.innerHTML = '<div class="warn">No matches.</div>'; return; }
  box.innerHTML = `<table><tr><th>SKU</th><th>Name</th><th>Cost</th></tr>` +
    matches.map(r => `<tr><td>${r[skuCol.title]||''}</td><td>${r[nameCol.title]||''}</td><td>${r[costCol?.title]||''}</td></tr>`).join('') +
    `</table>`;
}

function getLinkedDisplay(record, fieldTitle) {
  if (!fieldTitle) return '';
  const v = record[fieldTitle];
  if (!v) return '';
  if (Array.isArray(v)) return v.map(x => x[Object.keys(x).find(k=>k!=='Id')] || x.Id).join(', ');
  if (typeof v === 'object') return v[Object.keys(v).find(k=>k!=='Id')] || v.Id;
  return v.toString();
}
function getLinkedId(record, fieldTitle) {
  if (!fieldTitle) return null;
  const v = record[fieldTitle];
  if (!v) return null;
  if (Array.isArray(v)) return v[0]?.Id || null;
  if (typeof v === 'object') return v.Id || null;
  return null;
}

/* ================= SUPPLIERS ================= */
async function renderSuppliers() {
  app.innerHTML = `<div class="loader">Loading suppliers...</div>`;
  const resp = await listRecords(T.Suppliers.id, { limit: 500 });
  const nameCol = primaryCol(T.Suppliers);
  const contactCol = findCol(T.Suppliers, ['contact']);
  const phoneCol = findCol(T.Suppliers, ['phone']);
  const emailCol = findCol(T.Suppliers, ['email']);

    <div class="card">
      <h2>Add Supplier</h2>
      <div class="grid2">
        <div><label>Name</label><input id="supName"></div>
        <div><label>Contact</label><input id="supContact"></div>
        <div><label>Phone</label><input id="supPhone"></div>
        <div><label>Email</label><input id="supEmail"></div>
      </div>
      <button class="primary" onclick="saveSupplier()">Save Supplier</button>
      <div id="supMsg"></div>
    </div>
    <div class="card">
      <h2>All Suppliers</h2>
      <table><tr><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th></tr>
      ${(resp.list||[]).map(r => `<tr><td>${r[nameCol.title]||''}</td><td>${r[contactCol?.title]||''}</td><td>${r[phoneCol?.title]||''}</td><td>${r[emailCol?.title]||''}</td></tr>`).join('')}
      </table>
    </div>
  `;
}
async function saveSupplier() {
  const nameCol = primaryCol(T.Suppliers);
  const contactCol = findCol(T.Suppliers, ['contact']);
  const phoneCol = findCol(T.Suppliers, ['phone']);
  const emailCol = findCol(T.Suppliers, ['email']);
  const name = document.getElementById('supName').value.trim();
  const msg = document.getElementById('supMsg');
  if (!name) { msg.innerHTML = '<div class="err">Name required</div>'; return; }
  try {
    const fields = { [nameCol.title]: name };
    if (contactCol) fields[contactCol.title] = document.getElementById('supContact').value;
    if (phoneCol) fields[phoneCol.title] = document.getElementById('supPhone').value;
    if (emailCol) fields[emailCol.title] = document.getElementById('supEmail').value;
    await createRecord(T.Suppliers.id, fields);
    msg.innerHTML = '<div class="ok">Saved.</div>';
    renderSuppliers();
  } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
}

/* ================= PRODUCTS ================= */
async function renderProducts() {
  app.innerHTML = `<div class="loader">Loading products...</div>`;
  const [prodResp, supResp] = await Promise.all([
    listRecords(T.Products.id, { limit: 1000 }),
    listRecords(T.Suppliers.id, { limit: 500 })
  ]);
  const nameCol = findCol(T.Products, ['name']) || primaryCol(T.Products);
  const skuCol = primaryCol(T.Products);
  const supCol = findCol(T.Products, ['supplier']);
  const costCol = findCol(T.Products, ['cost']);
  const catCol = findCol(T.Products, ['category']);
  const descCol = findCol(T.Products, ['description']);
  const supplierOptions = (supResp.list||[]).map(s => `<option value="${s.Id}">${s[primaryCol(T.Suppliers).title]}</option>`).join('');

  app.innerHTML = `
    <div class="card">
      <h2>Add Product</h2>
      <div class="grid2">
        <div><label>SKU</label><input id="pSku"></div>
        <div><label>Name</label><input id="pName"></div>
        <div><label>Supplier</label><select id="pSupplier"><option value="">-- select --</option>${supplierOptions}</select></div>
        <div><label>Cost Price</label><input id="pCost" type="number" step="0.01"></div>
        <div><label>Category</label><input id="pCategory"></div>
        <div><label>Description</label><textarea id="pDesc"></textarea></div>
      </div>
      <button class="primary" onclick="saveProduct()">Save Product</button>
      <div id="pMsg"></div>
    </div>
    <div class="card">
      <h2>All Products (${(prodResp.list||[]).length})</h2>
      <input placeholder="Filter..." oninput="filterProductTable(this.value)">
      <table id="prodTable"><tr><th>SKU</th><th>Name</th><th>Cost</th><th>Category</th></tr>
      ${(prodResp.list||[]).map(r => `<tr><td>${r[skuCol.title]||''}</td><td>${r[nameCol.title]||''}</td><td>${r[costCol?.title]||''}</td><td>${r[catCol?.title]||''}</td></tr>`).join('')}
      </table>
    </div>
  `;
}
function filterProductTable(q) {
  const rows = document.querySelectorAll('#prodTable tr');
  rows.forEach((r,i) => { if(i===0) return; r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none'; });
}
async function saveProduct() {
  const nameCol = findCol(T.Products, ['name']) || primaryCol(T.Products);
  const skuCol = primaryCol(T.Products);
  const supCol = findCol(T.Products, ['supplier']);
  const costCol = findCol(T.Products, ['cost']);
  const catCol = findCol(T.Products, ['category']);
  const descCol = findCol(T.Products, ['description']);
  const msg = document.getElementById('pMsg');
  const sku = document.getElementById('pSku').value.trim();
  const name = document.getElementById('pName').value.trim();
  if (!sku && !name) { msg.innerHTML = '<div class="err">SKU/Name required</div>'; return; }
  try {
    const fields = {};
    fields[skuCol.title] = sku || name;
    if (nameCol.title !== skuCol.title) fields[nameCol.title] = name;
    if (costCol) fields[costCol.title] = parseFloat(document.getElementById('pCost').value)||0;
    if (catCol) fields[catCol.title] = document.getElementById('pCategory').value;
    if (descCol) fields[descCol.title] = document.getElementById('pDesc').value;
    const rec = await createRecord(T.Products.id, fields);
    const supId = document.getElementById('pSupplier').value;
    if (supId && supCol) await linkRecords(T.Products.id, supCol.id, rec.Id, [parseInt(supId)]);
    msg.innerHTML = '<div class="ok">Saved.</div>';
    renderProducts();
  } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }

async function createRevisionForRfq(rfqId, copyItems) {
  const revNameCol = primaryCol(T.Revisions);
  const parentCol = findCol(T.Revisions, ['parent']);
  const dateCol = findCol(T.Revisions, ['revision date','date']);
  const shipCol = findCol(T.Revisions, ['shipping']);
  const kdvCol = findCol(T.Revisions, ['kdv']);
  const validCol = findCol(T.Revisions, ['validity']);

  // count existing revisions for numbering
  const revLinkCol = findCol(T.RFQs, ['revisions']);
  let count = 0;
  if (revLinkCol) {
    const existing = await listLinked(T.RFQs.id, revLinkCol.id, rfqId);
    count = (existing.list||[]).length;
  }
  const fields = { [revNameCol.title]: `R${count}` };
  if (dateCol) fields[dateCol.title] = new Date().toISOString().slice(0,10);
  if (shipCol) fields[shipCol.title] = 0;
  if (kdvCol) fields[kdvCol.title] = 18;
  const revRec = await createRecord(T.Revisions.id, fields);
  if (parentCol) await linkRecords(T.Revisions.id, parentCol.id, revRec.Id, [rfqId]);

  if (copyItems && copyItems.length) {
    const itemNameCol = primaryCol(T.Items);
    const revItemLinkCol = findCol(T.Items, ['revision']);
    const prodLinkCol = findCol(T.Items, ['product']);
    const qtyCol = findCol(T.Items, ['quantity']);
    const priceCol = findCol(T.Items, ['unit price']);
    for (const it of copyItems) {
      const f = { [itemNameCol.title]: it.name };
      if (qtyCol) f[qtyCol.title] = it.qty;
      if (priceCol) f[priceCol.title] = it.price;
      const rec = await createRecord(T.Items.id, f);
      if (revItemLinkCol) await linkRecords(T.Items.id, revItemLinkCol.id, rec.Id, [revRec.Id]);
      if (prodLinkCol && it.productId) await linkRecords(T.Items.id, prodLinkCol.id, rec.Id, [it.productId]);
    }
  }
  return revRec.Id;
}

  await updateRecord(T.RFQs.id, rfqId, { [fieldTitle]: value });
}

}

async function startNewRevision(rfqId) {
  const revLinkCol = findCol(T.RFQs, ['revisions']);
  const revisions = await listLinked(T.RFQs.id, revLinkCol.id, rfqId);
  const revNameCol = primaryCol(T.Revisions);
  let latest = null, latestFull=[];
  for (const r of (revisions.list||[])) latestFull.push(await ncFetch(`/tables/${T.Revisions.id}/records/${r.Id}`));
  latestFull.sort((a,b)=> (a[revNameCol.title]||'').localeCompare(b[revNameCol.title]||''));
  latest = latestFull[latestFull.length-1];

  let copyItems = [];
  if (latest) {
    const itemLinkCol = findCol(T.Revisions, ['items']);
    const itemsResp = itemLinkCol ? await listLinked(T.Revisions.id, itemLinkCol.id, latest.Id) : {list:[]};
    const itemNameCol = primaryCol(T.Items);
    const qtyCol = findCol(T.Items, ['quantity']);
    const priceCol = findCol(T.Items, ['unit price']);
    const prodLinkCol = findCol(T.Items, ['product']);
    for (const it of (itemsResp.list||[])) {
      const full = await ncFetch(`/tables/${T.Items.id}/records/${it.Id}`);
      copyItems.push({
        name: full[itemNameCol.title],
        qty: full[qtyCol?.title]||1,
        price: full[priceCol?.title]||0,
        productId: getLinkedId(full, prodLinkCol?.title)
      });
    }
  }
  await createRevisionForRfq(rfqId, copyItems);
  openRfq(rfqId);
}

async function renderItemsForRevision(rfqId, revisionId) {
  const itemLinkCol = findCol(T.Revisions, ['items']);
  const itemsResp = itemLinkCol ? await listLinked(T.Revisions.id, itemLinkCol.id, revisionId) : {list:[]};
  const itemNameCol = primaryCol(T.Items);
  const qtyCol = findCol(T.Items, ['quantity']);
  const priceCol = findCol(T.Items, ['unit price']);
  const subtotalCol = findCol(T.Items, ['subtot']);
  const costCol = findCol(T.Items, ['cost price']);
  const profitCol = findCol(T.Items, ['profit']);
  const marginCol = findCol(T.Items, ['margin']);
  const prodLinkCol = findCol(T.Items, ['product']);

  let items = [];
  for (const it of (itemsResp.list||[])) {
    items.push(await ncFetch(`/tables/${T.Items.id}/records/${it.Id}`));
  }

  const shipCol = findCol(T.Revisions, ['shipping']);
  const kdvCol = findCol(T.Revisions, ['kdv']);
  const rev = await ncFetch(`/tables/${T.Revisions.id}/records/${revisionId}`);

  let totalCost=0, totalPrice=0;
  items.forEach(it => {
    totalCost += (it[qtyCol?.title]||0) * (it[costCol?.title]||0);
    totalPrice += it[subtotalCol?.title] || ((it[qtyCol?.title]||0)*(it[priceCol?.title]||0));
  });
  const profit = totalPrice - totalCost;
  const margin = totalPrice ? (profit/totalPrice*100).toFixed(2) : 0;
  const shipping = rev[shipCol?.title]||0;
  const kdv = rev[kdvCol?.title]||0;
  const subtotalWithShip = totalPrice + parseFloat(shipping||0);
  const kdvAmt = subtotalWithShip * (kdv/100);
  const grandTotal = subtotalWithShip + kdvAmt;

  const area = document.getElementById('itemsArea');
  area.innerHTML = `
    <div class="item-row header-row"><div>Product</div><div>Qty</div><div>Cost</div><div>Unit Price</div><div>Subtotal</div><div>Margin%</div><div></div></div>
    ${items.map(it => `<div class="item-row">
      <div>${it[itemNameCol.title]||''}</div>
      <div>${it[qtyCol?.title]||''}</div>
      <div>${(it[costCol?.title]||0).toFixed?.(2)||it[costCol?.title]}</div>
      <div>${it[priceCol?.title]||''}</div>
      <div>${(it[subtotalCol?.title]||0)}</div>
      <div>${it[marginCol?.title]||''}</div>
      <div></div>
    </div>`).join('')}
    <div class="totals-box">
      <div><div class="label">Total Cost</div><div class="value">${totalCost.toFixed(2)}</div></div>
      <div><div class="label">Total Price</div><div class="value">${totalPrice.toFixed(2)}</div></div>
      <div><div class="label">Profit</div><div class="value">${profit.toFixed(2)}</div></div>
      <div><div class="label">Margin</div><div class="value">${margin}%</div></div>
      <div><div class="label">Shipping</div><div class="value">${shipping}</div></div>
      <div><div class="label">KDV %</div><div class="value">${kdv}%</div></div>
      <div><div class="label">GRAND TOTAL</div><div class="value">${grandTotal.toFixed(2)}</div></div>
    </div>

    <h3 style="margin-top:20px;">Add Item</h3>
    <div class="autocomplete-box">
      <input id="itemProdSearch" placeholder="Search product...">
      <div id="itemProdList" class="ac-list" style="display:none;"></div>
    </div>
    <div class="grid3" style="margin-top:8px;">
      <div><label>Quantity</label><input id="itemQty" type="number" value="1"></div>
      <div><label>Unit Price</label><input id="itemPrice" type="number" step="0.01"></div>
      <div><label>Shipping (revision)</label><input id="itemShip" type="number" value="${shipping}" onchange="updateRevisionField(${revisionId}, '${shipCol?.title}', this.value)"></div>
    </div>
    <label>KDV % (revision)</label><input id="itemKdv" type="number" value="${kdv}" onchange="updateRevisionField(${revisionId}, '${kdvCol?.title}', this.value)">
    <input type="hidden" id="selectedProductId">
    <input type="hidden" id="selectedProductName">
    <input type="hidden" id="selectedProductCost">
    <button class="primary" onclick="addItemToRevision(${revisionId}, ${rfqId})">Add Item</button>
    <div id="itemMsg"></div>
  `;

  document.getElementById('itemProdSearch').addEventListener('input', debounce(async function() {
    const q = this.value.trim();
    const list = document.getElementById('itemProdList');
    if (!q) { list.style.display='none'; return; }
    const resp = await listRecords(T.Products.id, { limit: 200 });
    const nameCol = findCol(T.Products,['name']) || primaryCol(T.Products);
    const skuCol = primaryCol(T.Products);
    const costCol2 = findCol(T.Products, ['cost']);
    const matches = (resp.list||[]).filter(p => (p[nameCol.title]||'').toLowerCase().includes(q.toLowerCase()) || (p[skuCol.title]||'').toLowerCase().includes(q.toLowerCase())).slice(0,10);
    list.innerHTML = matches.map(p => `<div class="ac-item" onclick='selectItemProduct(${p.Id}, ${JSON.stringify(p[nameCol.title]||"")}, ${p[costCol2?.title]||0})'>${p[nameCol.title]} (${p[skuCol.title]}) - Cost ${p[costCol2?.title]}</div>`).join('');
    list.style.display = matches.length?'block':'none';
  }, 300));
}

  document.getElementById('selectedProductCost').value = cost;
  document.getElementById('itemProdSearch').value = name;
  document.getElementById('itemProdList').style.display = 'none';
  document.getElementById('itemPrice').value = cost;
}
async function updateRevisionField(revisionId, fieldTitle, value) {
  if (!fieldTitle || fieldTitle==='undefined') return;
  await updateRecord(T.Revisions.id, revisionId, { [fieldTitle]: parseFloat(value)||0 });
}
async function addItemToRevision(revisionId, rfqId) {
  const msg = document.getElementById('itemMsg');
  const prodId = document.getElementById('selectedProductId').value;
  const prodName = document.getElementById('selectedProductName').value;
  const qty = parseFloat(document.getElementById('itemQty').value)||1;
  const price = parseFloat(document.getElementById('itemPrice').value)||0;
  if (!prodId) { msg.innerHTML = '<div class="err">Select a product first.</div>'; return; }
  try {
    const itemNameCol = primaryCol(T.Items);
    const qtyCol = findCol(T.Items, ['quantity']);
    const priceCol = findCol(T.Items, ['unit price']);
    const revLinkCol = findCol(T.Items, ['revision']);
    const prodLinkCol = findCol(T.Items, ['product']);
    const fields = { [itemNameCol.title]: prodName };
    if (qtyCol) fields[qtyCol.title] = qty;
    if (priceCol) fields[priceCol.title] = price;
    const rec = await createRecord(T.Items.id, fields);
    if (revLinkCol) await linkRecords(T.Items.id, revLinkCol.id, rec.Id, [revisionId]);
    if (prodLinkCol) await linkRecords(T.Items.id, prodLinkCol.id, rec.Id, [parseInt(prodId)]);
    renderItemsForRevision(rfqId, revisionId);
  } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
}

/* ================= PDF PRINTING ================= */
async function printRfqPdf(rfqId) {
  const dealCol = primaryCol(T.RFQs);
  const rfqNumCol = findCol(T.RFQs, ['rfq number']);
  const companyLinkCol = findCol(T.RFQs, ['company']);
  const payCol = findCol(T.RFQs, ['payment terms']);
  const revLinkCol = findCol(T.RFQs, ['revisions']);

  const rfq = await ncFetch(`/tables/${T.RFQs.id}/records/${rfqId}`);
  const companyId = getLinkedId(rfq, companyLinkCol?.title);
  const company = companyId ? await ncFetch(`/tables/${T.Companies.id}/records/${companyId}`) : {};
  const companyNameCol = primaryCol(T.Companies);
  const addrCol = findCol(T.Companies, ['address']);
  const phoneCol = findCol(T.Companies, ['phone']);
  const emailCol = findCol(T.Companies, ['email']);

  const revisions = revLinkCol ? await listLinked(T.RFQs.id, revLinkCol.id, rfqId) : {list:[]};
  const revNameCol = primaryCol(T.Revisions);
  let revRows = [];
  for (const r of (revisions.list||[])) revRows.push(await ncFetch(`/tables/${T.Revisions.id}/records/${r.Id}`));
  revRows.sort((a,b)=>(a[revNameCol.title]||'').localeCompare(b[revNameCol.title]||''));
  const rev = revRows[revRows.length-1];
  if (!rev) { alert('No revision to print.'); return; }

  const itemLinkCol = findCol(T.Revisions, ['items']);
  const itemsResp = itemLinkCol ? await listLinked(T.Revisions.id, itemLinkCol.id, rev.Id) : {list:[]};
  const itemNameCol = primaryCol(T.Items);
  const qtyCol = findCol(T.Items, ['quantity']);
  const priceCol = findCol(T.Items, ['unit price']);
  const subtotalCol = findCol(T.Items, ['subtot']);
  let items = [];
  for (const it of (itemsResp.list||[])) items.push(await ncFetch(`/tables/${T.Items.id}/records/${it.Id}`));

  const shipCol = findCol(T.Revisions, ['shipping']);
  const kdvCol = findCol(T.Revisions, ['kdv']);
  const validCol = findCol(T.Revisions, ['validity']);

  let totalPrice = 0;
  items.forEach(it => totalPrice += (it[subtotalCol?.title] || ((it[qtyCol?.title]||0)*(it[priceCol?.title]||0))));
  const shipping = parseFloat(rev[shipCol?.title]||0);
  const kdv = parseFloat(rev[kdvCol?.title]||0);
  const subtotalWithShip = totalPrice + shipping;
  const kdvAmt = subtotalWithShip * (kdv/100);
  const grandTotal = subtotalWithShip + kdvAmt;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pw = doc.internal.pageSize.getWidth();

  // Header
  doc.setFontSize(16); doc.setFont(undefined,'bold');
  doc.text(COMPANY_INFO.name, 14, 18);
  doc.setFontSize(8); doc.setFont(undefined,'normal');
  doc.text(COMPANY_INFO.address, 14, 24);
  doc.text(`${COMPANY_INFO.phone} / ${COMPANY_INFO.mobile}`, 14, 29);
  doc.text(`${COMPANY_INFO.email} | ${COMPANY_INFO.web}`, 14, 34);

  doc.setFontSize(14); doc.setFont(undefined,'bold');
  doc.text('QUOTATION', pw-14, 18, {align:'right'});
  doc.setFontSize(9); doc.setFont(undefined,'normal');
  doc.text(`Ref: ${rfq[rfqNumCol?.title]||''}`, pw-14, 24, {align:'right'});
  doc.text(`Revision: ${rev[revNameCol.title]}`, pw-14, 29, {align:'right'});
  doc.text(`Date: ${new Date().toLocaleDateString()}`, pw-14, 34, {align:'right'});
  if (validCol && rev[validCol.title]) doc.text(`Valid Until: ${rev[validCol.title]}`, pw-14, 39, {align:'right'});

  doc.setLineWidth(0.5); doc.line(14, 42, pw-14, 42);

  doc.setFontSize(10); doc.setFont(undefined,'bold');
  doc.text('To:', 14, 50);
  doc.setFont(undefined,'normal');
  doc.text(`${company[companyNameCol.title]||''}`, 14, 56);
  doc.text(`${company[addrCol?.title]||''}`, 14, 61);
  doc.text(`${company[phoneCol?.title]||''} ${company[emailCol?.title]||''}`, 14, 66);
  if (payCol) doc.text(`Payment Terms: ${rfq[payCol.title]||''}`, 14, 71);

  const tableBody = items.map(it => [
    it[itemNameCol.title]||'',
    it[qtyCol?.title]||'',
    (it[priceCol?.title]||0).toFixed(2),
    (it[subtotalCol?.title]||((it[qtyCol?.title]||0)*(it[priceCol?.title]||0))).toFixed(2)
  ]);

  doc.autoTable({
    head: [['Description','Qty','Unit Price','Total']],
    body: tableBody,
    startY: 78,
    margin: {left:14, right:14},
    theme: 'grid',
    headStyles: { fillColor: [30,30,30] }
  });

  let y = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(9);
  doc.text(`Subtotal: ${totalPrice.toFixed(2)}`, pw-14, y, {align:'right'}); y+=6;
  doc.text(`Shipping: ${shipping.toFixed(2)}`, pw-14, y, {align:'right'}); y+=6;
  doc.text(`KDV (${kdv}%): ${kdvAmt.toFixed(2)}`, pw-14, y, {align:'right'}); y+=8;
  doc.setFontSize(12); doc.setFont(undefined,'bold');
  doc.text(`TOTAL: ${grandTotal.toFixed(2)}`, pw-14, y, {align:'right'});

  // Terms page
  doc.addPage();
  doc.setFontSize(9); doc.setFont(undefined,'normal');
  const lines = doc.splitTextToSize(TERMS_TEXT, pw-28);
  doc.text(lines, 14, 20);

  doc.save(`${rfq[rfqNumCol?.title]||'RFQ'}-${rev[revNameCol.title]}.pdf`);
}

/* ================= DASHBOARD ================= */
async function renderDashboard() {
  app.innerHTML = `<div class="loader">Crunching numbers...</div>`;
  const itemsResp = await listRecords(T.Items.id, { limit: 5000 });
  const items = itemsResp.list || [];
  const qtyCol = findCol(T.Items, ['quantity']);
  const costCol = findCol(T.Items, ['cost price']);
  const subtotalCol = findCol(T.Items, ['subtot']);
  const profitCol = findCol(T.Items, ['profit']);

  let totalCost=0, totalPrice=0, totalProfit=0;
  items.forEach(it => {
    totalCost += (it[qtyCol?.title]||0) * (it[costCol?.title]||0);
    totalPrice += it[subtotalCol?.title] || 0;
    totalProfit += it[profitCol?.title] || 0;
  });
  const avgMargin = totalPrice ? (totalProfit/totalPrice*100).toFixed(2) : 0;

  const rfqsResp = await listRecords(T.RFQs.id, { limit: 1000 });
  const statusCol = findCol(T.RFQs, ['status']);
  const statusCounts = {};
  (rfqsResp.list||[]).forEach(r => {
    const s = r[statusCol?.title]||'Unknown';
    statusCounts[s] = (statusCounts[s]||0)+1;
  });

  app.innerHTML = `
    <div class="dash-grid">
      <div class="dash-card"><div class="num">${(rfqsResp.list||[]).length}</div><div class="lab">Total RFQs</div></div>
      <div class="dash-card"><div class="num">${totalPrice.toFixed(0)}</div><div class="lab">Total Quoted Value</div></div>
      <div class="dash-card"><div class="num">${totalProfit.toFixed(0)}</div><div class="lab">Total Profit</div></div>
      <div class="dash-card"><div class="num">${avgMargin}%</div><div class="lab">Avg Margin</div></div>
    </div>
    <div class="card">
      <h2>RFQs by Status</h2>
      <table><tr><th>Status</th><th>Count</th></tr>
      ${Object.entries(statusCounts).map(([s,c]) => `<tr><td>${s}</td><td>${c}</td></tr>`).join('')}
      </table>
    </div>
    <div class="warn">Time-period filtering (week/month/quarter) and per-company profit breakdown are next-phase additions — this first dashboard gives you overall totals to confirm the numbers are accurate.</div>
  `;
}
